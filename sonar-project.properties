# ── SonarQube Cloud (SonarCloud) proje tanımı ────────────────────
sonar.organization=alfapars-exe
sonar.projectKey=alfapars-exe_bist-rl-portfolio

# Kaynak ve test kümeleri AYRIK olmalı (yoksa "File can't be indexed twice").
# Düz yerleşim: kök .py modülleri + paketler açıkça listelenir; testler ayrı.
sonar.sources=agents,core,env,forecast,utils,app.py,config.py,data.py,main.py,plots.py,train.py
sonar.tests=tests

# Desteklenen Python sürümleri (kural seçimi için)
sonar.python.version=3.10, 3.11, 3.12

# Coverage raporu (pytest-cov → Cobertura XML). Yol repo köküne göredir.
sonar.python.coverage.reportPaths=coverage.xml

# Analiz dışı (derleme/önbellek artıkları)
sonar.exclusions=**/__pycache__/**

sonar.sourceEncoding=UTF-8
